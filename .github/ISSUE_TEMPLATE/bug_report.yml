name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove credentials and private data before submitting."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest reproducible example.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Runtime, operating system, version, and relevant configuration.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include sanitized logs, stack traces, or screenshots.
